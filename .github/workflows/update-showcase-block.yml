name: Update the contributions showcase block

on:
  schedule:
    - cron: "30 6 * * *"   # after the showcase site rebuilds
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the block from the showcase site
        run: |
          curl -fsSL --retry 3 \
            "https://miyanialkesh7.github.io/contributions/profile-block.md" \
            -o "$RUNNER_TEMP/block.md"
          test -s "$RUNNER_TEMP/block.md"

      - name: Replace the block in README.md
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          readme = pathlib.Path("README.md")
          block = pathlib.Path(os.environ["RUNNER_TEMP"], "block.md").read_text().strip()
          text = readme.read_text()
          pattern = re.compile(r"(<!-- showcase:start -->\n).*?(\n<!-- showcase:end -->)", re.S)
          if not pattern.search(text):
              raise SystemExit("showcase markers not found in README.md")
          readme.write_text(pattern.sub(lambda m: m.group(1) + block + m.group(2), text))
          PY

      - name: Commit if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update the contributions showcase block" && git push
